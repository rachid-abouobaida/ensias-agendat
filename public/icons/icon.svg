<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Calendar Base -->
  <rect x="96" y="112" width="320" height="288" rx="36" fill="url(#cardGrad)" stroke="#3f3f46" stroke-width="3"/>

  <!-- Calendar Top Header -->
  <path d="M 96 148 C 96 128 112 112 132 112 L 380 112 C 400 112 416 128 416 148 L 416 192 L 96 192 Z" fill="url(#accentGrad)"/>

  <!-- Binder rings -->
  <rect x="160" y="88" width="24" height="48" rx="12" fill="#e4e4e7"/>
  <rect x="328" y="88" width="24" height="48" rx="12" fill="#e4e4e7"/>

  <!-- SDSI Text / Badge -->
  <text x="256" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">SDSI</text>

  <!-- Calendar Day Grid / Accent elements -->
  <circle cx="160" cy="248" r="16" fill="#10b981"/>
  <circle cx="224" cy="248" r="14" fill="#3f3f46"/>
  <circle cx="288" cy="248" r="14" fill="#3f3f46"/>
  <circle cx="352" cy="248" r="14" fill="#3f3f46"/>

  <circle cx="160" cy="304" r="14" fill="#3f3f46"/>
  <circle cx="224" cy="304" r="16" fill="#6366f1"/>
  <circle cx="288" cy="304" r="14" fill="#3f3f46"/>
  <circle cx="352" cy="304" r="14" fill="#3f3f46"/>

  <circle cx="160" cy="356" r="14" fill="#3f3f46"/>
  <circle cx="224" cy="356" r="14" fill="#3f3f46"/>
  <circle cx="288" cy="356" r="16" fill="#a855f7"/>
  <circle cx="352" cy="356" r="14" fill="#10b981"/>

  <!-- Live Pulse dot -->
  <circle cx="416" cy="96" r="16" fill="#10b981"/>
  <circle cx="416" cy="96" r="24" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.6"/>
</svg>
