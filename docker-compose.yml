services:
  agenda-sdsi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdsi-agenda-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SEMESTER_START_DATE=${NEXT_PUBLIC_SEMESTER_START_DATE:-2026-10-05}
      - PORT=3000
    volumes:
      # Persistent storage for CSV and JSON database
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/schedule || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
